name: Build & Push Docker Image

on:
  push:
    branches: [ "slice_conference" ]
  pull_request:
    branches: [ "skice_conference" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check Docker secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKER_USERNAME missing"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "DOCKER_TOKEN missing"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliceconference:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/sliceconference:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sliceconference:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sliceconference:${{ github.sha }}
  
